  sample-check-ubuntu-docker:
    name: docker-${{ matrix.runner.id }} - dependencies OFF
    runs-on: ubuntu-latest
    container: ${{ matrix.runner.docker }}
    timeout-minutes: 30
    env:
      AWS_KVS_LOG_LEVEL: 3
      KVS_ICE_TRANSPORT_POLICY: relay
      DEBIAN_FRONTEND: noninteractive
      KVS_CHANNEL_NAME: ScaryTestChannel-docker-${{ matrix.runner.id }}
    strategy:
      matrix:
        runner:
          - id: ubuntu-20.04
            docker: public.ecr.aws/ubuntu/ubuntu:20.04_stable
          - id: ubuntu-22.04
            docker: public.ecr.aws/ubuntu/ubuntu:22.04_stable
          - id: ubuntu-24.04
            docker: public.ecr.aws/ubuntu/ubuntu:24.04_stable
      fail-fast: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            cmake \
            build-essential \
            pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            libsrtp2-dev \
            libwebsockets-dev \
            libusrsctp-dev \
            curl \
            unzip
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build repository
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_DEPENDENCIES=OFF
          make -j

      - name: Sample check with force TURN
        run: |
          cd build/samples
          ./kvsWebrtcClientMaster $KVS_CHANNEL_NAME > master.log 2>&1 &
          MASTER_PID=$!
          sleep 15
          ./kvsWebrtcClientViewer $KVS_CHANNEL_NAME > viewer.log 2>&1 &
          VIEWER_PID=$!
          sleep 15

          # Interrupt after 30s, and kill 15s later for safety
          bash -c "sleep 30 && kill -s INT $MASTER_PID $VIEWER_PID" &
          bash -c "sleep 45 && kill -9 $MASTER_PID $VIEWER_PID" &
          wait $MASTER_PID
          MASTER_EXIT=$?
          wait $VIEWER_PID
          VIEWER_EXIT=$?

          if [ $MASTER_EXIT -ne 0 ] || [ $VIEWER_EXIT -ne 0 ]; then
            echo "Sample execution failed. Master exit code: $MASTER_EXIT, Viewer exit code: $VIEWER_EXIT"
            cat master.log
            cat viewer.log
            exit 1
          fi
          if grep "local candidate type: relay. remote candidate type: relay" master.log || \
             grep "local candidate type: relay. remote candidate type: relay" viewer.log; then
            echo "SUCCESS: Force TURN verified - relay candidates selected"
            exit 0
          else
            echo "FAILURE: Expected relay candidate pair not found in logs"
            cat master.log
            cat viewer.log
            exit 1
          fi

  gstreamer-sample-check-ubuntu-docker:
    name: docker-${{ matrix.runner.id }} - GStreamer testsrc
    runs-on: ubuntu-latest
    container: ${{ matrix.runner.docker }}
    timeout-minutes: 30
    env:
      AWS_KVS_LOG_LEVEL: 1
      KVS_ICE_TRANSPORT_POLICY: relay
      DEBIAN_FRONTEND: noninteractive
      KVS_CHANNEL_NAME: ScaryTestChannel-gst-${{ matrix.runner.id }}
    strategy:
      matrix:
        runner:
          - id: ubuntu-20.04
            docker: public.ecr.aws/ubuntu/ubuntu:20.04_stable
          - id: ubuntu-22.04
            docker: public.ecr.aws/ubuntu/ubuntu:22.04_stable
          - id: ubuntu-24.04
            docker: public.ecr.aws/ubuntu/ubuntu:24.04_stable
      fail-fast: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            cmake \
            build-essential \
            pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            libsrtp2-dev \
            libwebsockets-dev \
            libusrsctp-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            curl \
            unzip
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build repository
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_DEPENDENCIES=OFF
          make -j

      - name: GStreamer sample check with testsrc
        run: |
          cd build/samples
          ./kvsWebrtcClientMasterGstSample $KVS_CHANNEL_NAME video-only testsrc > master.log 2>&1 &
          MASTER_PID=$!
          sleep 15
          ./kvsWebrtcClientViewerGstSample $KVS_CHANNEL_NAME video-only > viewer.log 2>&1 &
          VIEWER_PID=$!
          sleep 30

          # Interrupt after 30s, and kill 15s later for safety
          bash -c "sleep 30 && kill -s INT $MASTER_PID $VIEWER_PID" &
          bash -c "sleep 45 && kill -9 $MASTER_PID $VIEWER_PID" &
          wait $MASTER_PID
          MASTER_EXIT=$?
          wait $VIEWER_PID
          VIEWER_EXIT=$?

          if [ $MASTER_EXIT -ne 0 ] || [ $VIEWER_EXIT -ne 0 ]; then
            echo "Sample execution failed. Master exit code: $MASTER_EXIT, Viewer exit code: $VIEWER_EXIT"
            echo "=== Master Log ==="
            cat master.log
            echo "=== Viewer Log ==="
            cat viewer.log
            exit 1
          fi

          # Validate frames were received by the viewer
          if grep -q "Video frame size" viewer.log; then
            FRAME_COUNT=$(grep -c "Video frame size" viewer.log)
            echo "SUCCESS: Viewer received $FRAME_COUNT video frames"
          else
            echo "FAILURE: Viewer did not receive any video frames"
            echo "=== Master Log ==="
            cat master.log
            echo "=== Viewer Log ==="
            cat viewer.log
            exit 1
          fi

